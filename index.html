<style>
  /* one look, set by the game: the ground round the picture, a note for when it cannot start, the focus ring */
  /* the picture keeps clear of a phone's notch and bars, which are 0 px in a window */
  :root { --ground: #0e0b0a; --note-ground: rgba(14, 11, 10, 0.86); --note: #f6f2ee; --focus: #ffd84a; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--ground); color: var(--note); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .stage { position: fixed; inset: 0; box-sizing: border-box; display: grid; place-items: center; overflow: hidden; touch-action: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #screen { display: block; image-rendering: pixelated; touch-action: none; outline: none; cursor: pointer; }
  #screen.smooth { image-rendering: auto; }
  #screen:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .full { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; padding: 10px; border: 0; border-radius: 6px; background: var(--note-ground); color: var(--note); opacity: 0.5; cursor: pointer; touch-action: manipulation; }
  .full:hover, .full:focus-visible { opacity: 1; }
  .full:focus-visible { outline: 2px solid var(--focus); }
  .full svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; }
  .full .in, .full.on .out { display: none; }
  .full.on .in { display: inline; }
  .note { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 8px 12px; border-radius: 6px; font: 13px ui-sans-serif, system-ui, sans-serif; background: var(--note-ground); color: var(--note); text-align: center; }

<script>
// PixelKit: a small software rasteriser for pixel-art films. Everything draws into layers of packed

  function rng(seed) {

      a = (a + 0x6d2b79f5) >>> 0;

  e.preventDefault();
  if (e.repeat || held.has(e.code)) return;
  held.add(e.code);
  send({ type: 'press', key });
});
document.addEventListener('keyup', e => {
  const key = KEYS[e.code];
  if (!key || !held.delete(e.code)) return;
  send({ type: 'release', key });
});
window.addEventListener('blur', () => { for (const code of held) send({ type: 'release', key: KEYS[code] }); held.clear(); });
// A click or a touch counts anywhere on the page, not only on the picture: a thumb on a phone rests beside it.
// Each finger has its id, so a game can tell two thumbs apart; with "moves" a finger that is down is followed.
const down = new Set();
stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType !== 'touch') cv.focus({ preventScroll: true });
  down.add(e.pointerId);
  if (GAME.moves) { try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ } }
  send(Object.assign({ type: 'press', key: 'pointer', id: e.pointerId }, at(e)));
});
for (const ev of ['pointerup', 'pointercancel']) stage.addEventListener(ev, e => { down.delete(e.pointerId); send(Object.assign({ type: 'release', key: 'pointer', id: e.pointerId }, at(e))); });
if (GAME.moves) stage.addEventListener('pointermove', e => { if (down.has(e.pointerId)) send(Object.assign({ type: 'move', key: 'pointer', id: e.pointerId }, at(e))); });
stage.addEventListener('contextmenu', e => e.preventDefault());

// hooks for `pix check`, and for a script to play the game: hold the clock at t, press a key at a time
window.PLAYER = { loop: CONFIG.loop, filmError: gameError, get game() { return game; }, played: A.played };
window.seek = t => { C.fixed = t; if (game) drawFrame(t); return true; };
window.press = (key, t, type = 'press') => { send({ type, key, t: t == null ? now() : t }); return true; };
window.ready = true;
</script>
